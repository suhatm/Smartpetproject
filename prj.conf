# LIHAObohuan 宠物环 · 电源/开关机/LED 指示基础固件
#
# 范围（对齐 docs/电源开关机与LED指示产品方案.md V1.0）：
#   - nPM1300 模式管理（Active / Ship，Hibernate 预留）
#   - SW1（SHPHLD）开关机：长按约 0.6 s 开机（PMIC 硬件）、按住 3 s 松开关机、10 s 硬件应急复位
#   - LED 指示：开机 LED0(红) 闪 3 s / 关机 LED1(蓝) 闪 3 s / 就绪双灯同闪 3 s
#   - 三路电源域独立控制：VDD_SENS_3V0(LDSW1) / VDD_STORE_3V0_SW(LDSW2) / VDD_ANA_3V0(ANA_EN=P1.06)
#   - uart20 必须禁用（DK 默认 pinctrl 与 ANA_EN/PMIC_SDA/ADC_HEART/IMU_INT2 四脚冲突）
#
# 参考：petChoker（EVT0 已验证实现），本板差异：ANA_EN P1.05 -> P1.06。

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
# 本 SDK（C:\ncs\v3.4.0）中 nPM1300 归并到 npm13xx 驱动族
CONFIG_MFD_NPM13XX=y

# ---- 控制台：SEGGER RTT（uart20 冲突规避，双保险之一）----
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
# RTT 上行缓冲扩到 4KB：BLE 测试事件多（connect/disconnect/led_write/adv），
# 1KB 默认值一轮测试就写满导致后续日志被 NO_BLOCK_SKIP 丢弃（2026-10-01 实测踩坑）
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# 关键：防止 SHELL 相关 select 链反向打开 SERIAL 从而初始化 uart20
CONFIG_SHELL_BACKEND_SERIAL=n

# 日志精简：仅 printk
CONFIG_BOOT_BANNER=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- 蓝牙从机：LED 测试服务（task-V1.02，docs/蓝牙驱动测试方案.md §3.1）----
# 参考 PDF《Bbo nRF 开发指南》§5.1（peripheral_lbs）最小配置，
# 服务改为自定义（LED0/1 挂 nPM1300 LEDDRV，不能直用 CONFIG_BT_LBS）
CONFIG_BT=y                    # 开启蓝牙功能
CONFIG_BT_PERIPHERAL=y         # 蓝牙为从机角色
CONFIG_BT_DEVICE_NAME="SmartPet"  # 蓝牙广播名称

# ---- 蓝牙从机：IMU 数据流服务（task-V1.03 第二步）----
# ATT MTU 247：一包最多 (247-3-2)/12 = 20 帧六轴数据
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# ---- IMU 采集（task-V1.03 第二步，U4=LSM6DSV16XTR@0x6B）----
CONFIG_SENSOR=y
CONFIG_LSM6DSV16X=y
# drdy 经 INT1(P0.00) 触发，回调跑系统工作队列（无独立线程省 1KB 栈）
CONFIG_LSM6DSV16X_TRIGGER_GLOBAL_THREAD=y
# 关闭 RTIO 流式（SENSOR_ASYNC_API），同步 API 足够且栈开销小
CONFIG_LSM6DSV16X_STREAM=n

# ---- 可靠性兜底（2026-10-01：MPSL 库死锁实锤后加入）----
# 硬件看门狗：任何线程/库挂死 -> 30s 后复位 -> 恢复广播（wdt31）
# Nordic 官方针对 nRF54L15 MPSL 已知时序问题的建议值（默认 845 → 1650），
# 给 HFXO 调谐留足启动裕量，降低 MPSL 断连竞态概率（DevZone 多帖实证）
CONFIG_MPSL_HFCLK_LATENCY=1650

# 硬件看门狗 wdt31 (MPSL死锁兜底)
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# ==== task-V1.04 外设扩展 ====
# TMP112A 温度（柔性板 U2，i2c21@0x48）
CONFIG_TMP112=y

# SD NAND（U12 CSNP1GCR01，spi00 + SD 2.0 SPI 模式 + FATFS）
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y

# 双 PDM 麦克风（U5/U6 IM69D128，pdm20 立体声）
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# V1.04调试：SD初始化失败定位（定位后可去掉）
CONFIG_SD_LOG_LEVEL_INF=y
CONFIG_SDHC_LOG_LEVEL_WRN=y
