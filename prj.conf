# LIHAObohuan 宠物环 · 电源/开关机/LED 指示基础固件
#
# 范围（对齐 docs/电源开关机与LED指示产品方案.md V1.0）：
#   - nPM1300 模式管理（Active / Ship，Hibernate 预留）
#   - SW1（SHPHLD）开关机：长按约 0.6 s 开机（PMIC 硬件）、按住 3 s 松开关机、10 s 硬件应急复位
#   - LED 指示：开机 LED0(红) 闪 3 s / 关机 LED1(蓝) 闪 3 s / 就绪双灯同闪 3 s
#   - 三路电源域独立控制：VDD_SENS_3V0(LDSW1) / VDD_STORE_3V0_SW(LDSW2) / VDD_ANA_3V0(ANA_EN=P1.06)
#   - uart20 必须禁用（DK 默认 pinctrl 与 ANA_EN/PMIC_SDA/ADC_HEART/IMU_INT2 四脚冲突）
#
# 参考：petChoker（EVT0 已验证实现），本板差异：ANA_EN P1.05 -> P1.06。

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
# 本 SDK（C:\ncs\v3.4.0）中 nPM1300 归并到 npm13xx 驱动族
CONFIG_MFD_NPM13XX=y

# ---- 控制台：SEGGER RTT（uart20 冲突规避，双保险之一）----
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
# 关键：防止 SHELL 相关 select 链反向打开 SERIAL 从而初始化 uart20
CONFIG_SHELL_BACKEND_SERIAL=n

# 日志精简：仅 printk
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
